name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # The project (module-2/block-3-5-6) requires Python >= 3.14.
    # Tests run with pytest (pytest-django), not the stock `manage.py test`.
    strategy:
      matrix:
        python-version: ['3.14']

    defaults:
      run:
        working-directory: module-2/block-3-5-6

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: pip install poetry
    - name: Install Dependencies
      run: poetry install --no-root
    - name: Run Tests
      run: poetry run pytest
      working-directory: module-2/block-3-5-6/project
